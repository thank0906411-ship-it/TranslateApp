name: Build and Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write local.properties
        # 이 저장소는 public이라 여기서 만든 release APK를 누구나 다운로드해 디컴파일할
        # 수 있다. GOOGLE_TRANSLATE_API_KEY(과금되는 Cloud Translation 키)와
        # UPDATE_CHECK_PAT를 여기 넣으면 APK 안에 평문으로 박혀 유출되므로, 공개 빌드에는
        # 절대 주입하지 않는다. 키가 없으면 FallbackTranslator가 자동으로 ML Kit
        # 온디바이스 번역으로 동작하고, public repo는 인증 없이도 Releases API를 호출할
        # 수 있어 업데이트 확인 기능도 PAT 없이 정상 동작한다. 고품질 번역이 필요하면
        # 로컬 local.properties에 본인 키를 넣어 직접 빌드해서 쓴다.
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Verify tag matches versionCode
        run: |
          TAG_DIGITS=$(echo "${GITHUB_REF_NAME}" | tr -dc '0-9')
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ "$TAG_DIGITS" != "$VERSION_CODE" ]; then
            echo "::error::태그(${GITHUB_REF_NAME} -> $TAG_DIGITS)와 versionCode($VERSION_CODE)가 일치하지 않습니다. 앱 내 업데이트 확인 로직이 태그의 숫자를 versionCode로 비교하므로 반드시 일치해야 합니다."
            exit 1
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
