name: Build and Release APK

on:
  push:
    tags:
      - "v*"

# 릴리스 노트를 만들 때 직전 태그를 찾아야 하므로 전체 히스토리가 필요하다
# (fetch-depth: 0 없이는 checkout이 최신 커밋 하나만 받아온다).

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write local.properties
        # 이 저장소는 public이라 여기서 만든 release APK를 누구나 다운로드해 디컴파일할
        # 수 있다. GOOGLE_TRANSLATE_API_KEY는 결제 수단을 막아둔 상태라 금전 피해는
        # 없지만, 무료 할당량 소진이나 키 정지 위험은 남아 있음을 감수하고 테스터들이
        # 더 자연스러운 번역을 체험할 수 있도록 의도적으로 다시 주입한다. 없으면
        # FallbackTranslator가 자동으로 ML Kit 온디바이스 번역으로 폴백한다.
        # UPDATE_CHECK_PAT는 public repo에서는 필요 없으므로(인증 없이도 Releases API
        # 호출 가능) 계속 주입하지 않는다.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "GOOGLE_TRANSLATE_API_KEY=${{ secrets.GOOGLE_TRANSLATE_API_KEY }}" >> local.properties

      - name: Verify tag matches versionCode
        run: |
          TAG_DIGITS=$(echo "${GITHUB_REF_NAME}" | tr -dc '0-9')
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ "$TAG_DIGITS" != "$VERSION_CODE" ]; then
            echo "::error::태그(${GITHUB_REF_NAME} -> $TAG_DIGITS)와 versionCode($VERSION_CODE)가 일치하지 않습니다. 앱 내 업데이트 확인 로직이 태그의 숫자를 versionCode로 비교하므로 반드시 일치해야 합니다."
            exit 1
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commit messages
        # generate_release_notes(GitHub 자동 생성)는 PR 제목 기반이라, PR 없이 태그만
        # push하는 이 저장소에서는 "Full Changelog 비교 링크"만 나오고 실제로 무엇이
        # 바뀌었는지는 전혀 보여주지 않았다. 앱 내 "업데이트 확인" 다이얼로그가 이
        # 릴리스의 body를 그대로 보여주므로, 직전 태그 이후의 커밋 메시지(제목+본문,
        # "Co-Authored-By" 트레일러는 제외)를 그대로 모아 사람이 읽을 수 있는 내용으로 채운다.
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="${GITHUB_REF_NAME}"
          else
            RANGE="$PREV_TAG..${GITHUB_REF_NAME}"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            git log "$RANGE" --reverse --format='%B%n---' | grep -v '^Co-Authored-By:'
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body: ${{ steps.notes.outputs.notes }}
