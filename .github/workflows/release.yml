name: Build and Release APK

on:
  push:
    tags:
      - "v*"

# 릴리스 노트를 만들 때 직전 태그를 찾아야 하므로 전체 히스토리가 필요하다
# (fetch-depth: 0 없이는 checkout이 최신 커밋 하나만 받아온다).

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write local.properties
        # 이 저장소는 public이라 여기서 만든 release APK를 누구나 다운로드해 디컴파일할
        # 수 있다. GOOGLE_TRANSLATE_API_KEY는 결제 수단을 막아둔 상태라 금전 피해는
        # 없지만, 무료 할당량 소진이나 키 정지 위험은 남아 있음을 감수하고 테스터들이
        # 더 자연스러운 번역을 체험할 수 있도록 의도적으로 다시 주입한다. 없으면
        # FallbackTranslator가 자동으로 ML Kit 온디바이스 번역으로 폴백한다.
        # UPDATE_CHECK_PAT는 public repo에서는 필요 없으므로(인증 없이도 Releases API
        # 호출 가능) 계속 주입하지 않는다.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "GOOGLE_TRANSLATE_API_KEY=${{ secrets.GOOGLE_TRANSLATE_API_KEY }}" >> local.properties

      - name: Verify tag matches versionCode
        # 태그에 -beta1 같은 접두사가 붙어도(예: v35-beta1) 하이픈 앞부분(v35)의 숫자만
        # versionCode와 비교한다. tr로 문자열 전체에서 숫자만 뽑으면 "351"이 되어
        # versionCode=35와 어긋나 버리므로, 반드시 하이픈 앞부분만 잘라내야 한다.
        run: |
          TAG_DIGITS=$(echo "${GITHUB_REF_NAME}" | cut -d'-' -f1 | tr -dc '0-9')
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ "$TAG_DIGITS" != "$VERSION_CODE" ]; then
            echo "::error::태그(${GITHUB_REF_NAME} -> $TAG_DIGITS)와 versionCode($VERSION_CODE)가 일치하지 않습니다. 앱 내 업데이트 확인 로직이 태그의 숫자를 versionCode로 비교하므로 반드시 일치해야 합니다."
            exit 1
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Determine prerelease flag
        # 태그 이름에 하이픈이 있으면(예: v35-beta1) 테스트 버전으로 간주해 pre-release로
        # 표시한다. GitHub의 /releases/latest API는 pre-release를 자동으로 제외하므로,
        # 일반 사용자의 앱(AppUpdateChecker)은 이 릴리스를 감지하지 못하고 개발자가
        # GitHub 웹의 Releases 페이지에서 직접 다운로드해야만 확인할 수 있다.
        # versionCode는 태그의 숫자만 추출해 쓰므로(Verify tag matches versionCode 참고)
        # "v35-beta1"도 versionCode=35로 정상 매칭된다.
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate APK
        # 베타 태그로 빌드된 APK는 파일명 자체에 "test"를 명시해, 정식 배포 APK
        # (app-release.apk)와 혼동해 일반 사용자에게 잘못 배포하는 실수를 막는다.
        id: apk
        run: |
          SRC_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ "${{ steps.prerelease.outputs.flag }}" = "true" ]; then
            OUT_PATH="$(dirname "$SRC_PATH")/app-test-${GITHUB_REF_NAME}.apk"
            cp "$SRC_PATH" "$OUT_PATH"
          else
            OUT_PATH="$SRC_PATH"
          fi
          echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commit messages
        # generate_release_notes(GitHub 자동 생성)는 PR 제목 기반이라, PR 없이 태그만
        # push하는 이 저장소에서는 "Full Changelog 비교 링크"만 나오고 실제로 무엇이
        # 바뀌었는지는 전혀 보여주지 않았다. 앱 내 "업데이트 확인" 다이얼로그가 이
        # 릴리스의 body를 그대로 보여주므로, 커밋 본문 전체(배경/이유 설명 포함)를
        # 넣으면 사용자 입장에서 너무 길다 — 직전 태그 이후의 커밋 제목(첫 줄)만
        # 모아 간단한 불릿 목록으로 채운다.
        #
        # "직전 태그"를 찾을 때 정식 태그(하이픈 없음)와 베타 태그(하이픈 있음)를
        # 구분한다 — 안 그러면 예를 들어 v36을 정식 배포할 때 git describe가 바로
        # 앞의 v36-beta2를 "직전 태그"로 잡아버려, 베타 단계(v35 이후 v36-beta1/beta2)에
        # 있었던 실제 기능 변경 커밋들이 정식 릴리스 노트에서 통째로 누락된다
        # (v36에서 실제로 이 문제가 발생해 발견함). 정식 태그를 만들 때는 다른 정식
        # 태그만, 베타 태그를 만들 때는(직전 베타/정식 상관없이) 아무 태그나 기준으로 삼는다.
        id: notes
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            MATCH_PATTERN="v*"
          else
            MATCH_PATTERN="v*[0-9]"
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 --match "$MATCH_PATTERN" --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ] && [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          fi
          if [ -z "$PREV_TAG" ]; then
            RANGE="${GITHUB_REF_NAME}"
          else
            RANGE="$PREV_TAG..${GITHUB_REF_NAME}"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            git log "$RANGE" --reverse --format='- %s'
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ steps.prerelease.outputs.flag }}
